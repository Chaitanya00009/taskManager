name: Master to Docker

on:
  workflow_dispatch:

jobs:
  push-to-docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: master

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "24"

      - name: Login to Docker Hub
        run: echo "${{secrets.DOCKER_PASSWORD}}" | docker login -u "${{secrets.DOCKER_USERNAME}}" --password-stdin

      - name: Build a new Docker image
        run: docker build -t "${{secrets.DOCKER_USERNAME}}/taskmanager:${{github.sha}}" .

      - name: Docker push Image
        run: docker push "${{secrets.DOCKER_USERNAME}}/taskmanager:${{github.sha}}"
