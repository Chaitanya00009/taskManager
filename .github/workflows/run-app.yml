name: Run Task Manager App

on:
  push:
    branches:
      - test
  workflow_dispatch:
jobs:
  run-app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3 #Tells the repo to download this updated code in the sandbox env

      - name: Setup Node.js
        uses: actions/setup-node@v3 #To install the dependencies (node in this case along with version)
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Start app in background
        run: nohup node index.js &

      - name: Health Check
        run: curl --fail http://localhost:1100 || exit 1 #curl either returns success (0) or non-zero which will be converted to 1
